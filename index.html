function clOldAuc(d){const c=Date.now()-d*864e5;return(S.auctions||[]).filter(a=>{if(!a.closed)return false;const t=clTs(a.endAt||a.closedAt);if(!t||t>=c)return false;return!(a.ids||[]).map(get).some(i=>i&&i.sold&&i.sold.auc==a.id&&i.sold.pay&&i.sold.pay!='Paid')})}

async function cleanRun(){const p=CLN.pre;if(!p||!CLN.exp||CLN.busy)return;const on=k=>{const e=$('#cl_'+k);return e&&e.checked&&!e.disabled},w={ord:on('ord'),auc:on('auc'),sold:on('sold'),drive:on('drive')};if(!w.ord&&!w.auc&&!w.sold&&!w.drive)return toast('Tick something to clean first');

S.settings.lastClean=Date.now();save();
if(S.settings.url){say('Updating the Google Sheet…');await push(true)}
if(w.drive&&S.settings.url&&p.dr&&((p.dr.backups||0)+(p.dr.photos||0))){say('Cleaning Google Drive…');const r=await ordPost({action:'driveclean',days:CLN.days,dry:0});res.push((r.backups||0)+' old backups and '+(r.photos||0)+' unused photos moved to the Drive trash')}
CLN.busy=0;CLN.pre=null;CLN.exp=0;render();modal(`<h3>Cleanup done</h3>${res.length?'<ul style="margin:6px 0 6px 18px;padding:0">'+res.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>Nothing needed cleaning.</p>'}<p class=mut>Your sales totals and Reports are unchanged. If something looks wrong, use Restore snapshot in Backup.</p>`)}
catch(e){console.error(e);CLN.busy=0;say('Stopped: '+String(e&&e.message||e)+'. Anything already removed is saved; run the cleanup again to finish.');render()}}

(function(){
function fix(){document.querySelectorAll('input[type=number]').forEach(function(e){var n=e.getAttribute('max');e.type='text';e.setAttribute('inputmode',n?'numeric':'decimal');e.setAttribute('autocomplete','off');e.setAttribute('data-money','');if(!e.hasAttribute('placeholder')&&!e.value)e.setAttribute('placeholder','0');});
